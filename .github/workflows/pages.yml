# LP（lp フォルダ）を GitHub Pages に公開する設定
# main ブランチに変更が入ると自動で公開されます。手動実行（Run workflow）もできます。
name: Deploy LP to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["lp/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lp
      - id: deployment
        uses: actions/deploy-pages@v4
